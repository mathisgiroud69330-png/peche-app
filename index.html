<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventaire Pêche Électrique</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00695c">

<style>
body{
font-family:Arial;
margin:10px;
background:#f5f6f8;
}

.card{
background:white;
padding:16px;
border-radius:12px;
margin-bottom:12px;
}

button{
padding:16px;
width:100%;
font-size:18px;
border:none;
border-radius:10px;
margin:6px 0;
background:#00695c;
color:white;
}

button.danger{background:#b00020}

input,select{
width:100%;
padding:12px;
margin:6px 0;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
font-size:16px;
background:white;
border-radius:10px;
overflow:hidden;
}

th{
background:#00695c;
color:white;
padding:14px;
text-align:left;
}

td{
padding:14px;
border-bottom:1px solid #eee;
}

tr{
cursor:pointer;
height:52px;
}

tr:active{
background:#e0f2f1;
}

.big{font-size:18px;font-weight:bold}
.small{font-size:12px;color:#666}

.flex{display:flex;gap:8px}
.flex > div{flex:1}
</style>

</head>

<body>

<div id="app"></div>

<script src="app.js"></script>

<!-- ================= PWA INSTALL V8 (CORRIGÉ) ================= -->
<script>
let deferredPrompt = null;

// capture event si dispo
window.addEventListener("beforeinstallprompt", (e) => {
e.preventDefault();
deferredPrompt = e;
showInstallButton();
});

// fallback SI EVENT NE SE DECLENCHE PAS
window.addEventListener("load", () => {
setTimeout(showInstallButton, 3000);
});

function showInstallButton(){

if(document.getElementById("installBtn")) return;

const btn = document.createElement("button");
btn.id = "installBtn";
btn.innerText = "📲 Installer l'application";

btn.style.position = "fixed";
btn.style.bottom = "20px";
btn.style.left = "10px";
btn.style.right = "10px";
btn.style.zIndex = "9999";
btn.style.background = "#00695c";
btn.style.color = "white";
btn.style.padding = "16px";
btn.style.fontSize = "18px";
btn.style.border = "none";
btn.style.borderRadius = "10px";

btn.onclick = async () => {

btn.remove();

// si PWA dispo
if(deferredPrompt){
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt = null;
return;
}

// fallback manuel
alert("Pour installer : menu Chrome → 'Ajouter à l'écran d'accueil'");
};

document.body.appendChild(btn);
}
</script>

<!-- ================= SERVICE WORKER ================= -->
<script>
if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
