<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventaire Pêche Électrique</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00695c">

<style>
body{
font-family:Arial;
margin:10px;
background:#f5f6f8;
}

.card{
background:white;
padding:16px;
border-radius:12px;
margin-bottom:12px;
}

button{
padding:16px;
width:100%;
font-size:18px;
border:none;
border-radius:10px;
margin:6px 0;
background:#00695c;
color:white;
}

button.danger{background:#b00020}

input,select{
width:100%;
padding:12px;
margin:6px 0;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
font-size:16px;
background:white;
border-radius:10px;
overflow:hidden;
}

th{
background:#00695c;
color:white;
padding:14px;
text-align:left;
}

td{
padding:14px;
border-bottom:1px solid #eee;
}

tr{
cursor:pointer;
height:52px;
}

tr:active{
background:#e0f2f1;
}

.big{font-size:18px;font-weight:bold}
.small{font-size:12px;color:#666}

.flex{display:flex;gap:8px}
.flex > div{flex:1}
</style>

</head>

<body>

<div id="app"></div>

<script src="app.js"></script>

<script>
if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
